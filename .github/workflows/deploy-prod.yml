name: Deploy to Prod (Docker)

on:
    push:
        branches:
            - main # Se déclenche quand une PR est mergée vers prod
    pull_request:
        branches:
            - main # Lint uniquement pour valider la PR avant merge
    workflow_dispatch:

jobs:
    lint:
        name: Lint Code
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24.3"
                  cache: "pnpm"
                  cache-dependency-path: "frontend/pnpm-lock.yaml"

            - name: Install frontend dependencies
              working-directory: ./frontend
              run: pnpm install --frozen-lockfile

            - name: Lint frontend
              working-directory: ./frontend
              run: pnpm lint

            - name: Type-check frontend
              working-directory: ./frontend
              run: pnpm run type

    deploy:
        name: Deploy prod to VPS with Docker
        needs: lint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to VPS
              uses: appleboy/ssh-action@master
              env:
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PROD_PATH }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_KEY }}
                  envs: DEPLOY_PATH
                  script: |
                      set -e
                      echo "🚀 Starting Docker deployment..."

                      cd "$DEPLOY_PATH" || { echo "❌ Project directory not found"; exit 1; }

                      echo "📥 Pulling latest changes from main..."
                      git fetch origin main
                      git reset --hard origin/main

                      echo " Building and restarting containers..."
                      make prod
                      echo "🧹 Cleaning up old Docker images..."
                      docker image prune -f

                      echo "✅ Deployment complete!"
                      echo "📊 Container status:"
                      docker compose -f docker-compose.prod.yml ps
